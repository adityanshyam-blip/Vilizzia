<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vilizzia — Get paid. Get delivered. Every time.</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --ink: #0F1729; --ink-2: #172038; --ink-3: #1E2A46;
    --paper: #F7F5F0; --paper-dim: #EDE9DF;
    --seal: #C89B3C; --seal-bright: #E0B85C;
    --slate: #8B93A7; --slate-dim: #5C6377;
    --release: #2F8F6F; --danger: #C0564B;
    --line: rgba(247,245,240,0.12);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background: var(--ink); color: var(--paper); font-family:'IBM Plex Sans',sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased; min-height:100vh; }
  h1,h2,h3 { font-family:'Fraunces',serif; font-weight:500; letter-spacing:-0.01em; }
  .mono { font-family:'IBM Plex Mono',monospace; }
  a { color: inherit; text-decoration:none; }
  button { font-family:inherit; cursor:pointer; border:none; }
  input, textarea, select { font-family:inherit; }

  .wrap { max-width: 1120px; margin:0 auto; padding: 0 32px; }
  .app { max-width: 1120px; margin:0 auto; padding: 0 32px 80px; }

  /* ===== NAV ===== */
  nav { display:flex; align-items:center; justify-content:space-between; padding:26px 0; border-bottom:1px solid var(--line); }
  .logo { display:flex; align-items:center; gap:10px; font-size:19px; font-family:'Fraunces',serif; font-weight:600; }
  .logo-mark { width:28px; height:28px; border-radius:50%; background:radial-gradient(circle at 35% 30%, var(--seal-bright), var(--seal) 70%); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .logo-mark svg { width:14px; height:14px; }
  nav .links { display:flex; gap:36px; font-size:14px; color:var(--slate); }
  nav .links a:hover { color:var(--paper); }
  .nav-right { display:flex; align-items:center; gap:16px; font-size:14px; color:var(--slate); }
  .nav-user { display:flex; align-items:center; gap:10px; }
  .role-badge { font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.06em; padding:4px 9px; border-radius:100px; background:var(--ink-3); color:var(--seal-bright); }
  .btn-link { background:none; color:var(--slate); font-size:14px; text-decoration:underline; }
  .btn-link:hover { color:var(--paper); }
  .nav-cta { font-size:14px; color:var(--ink); background:var(--paper); padding:10px 20px; border-radius:100px; font-weight:500; }

  .btn { padding:12px 22px; border-radius:8px; font-size:14px; font-weight:600; display:inline-flex; align-items:center; gap:8px; }
  .btn-primary { background:var(--seal); color:var(--ink); }
  .btn-primary:hover { background:var(--seal-bright); }
  .btn-primary:disabled { opacity:0.4; cursor:not-allowed; }
  .btn-ghost { background:transparent; border:1px solid var(--line); color:var(--paper); }
  .btn-ghost:hover { border-color:var(--seal); }
  .btn-danger { background:transparent; border:1px solid rgba(192,86,75,0.4); color:var(--danger); }
  .btn-danger:hover { background:rgba(192,86,75,0.1); }
  .btn-release { background:var(--release); color:#fff; }
  .btn-sm { padding:8px 16px; font-size:13px; }
  .btn-full { width:100%; justify-content:center; }

  /* ===== LANDING ===== */
  .hero { padding:100px 0 80px; display:grid; grid-template-columns:1.05fr 0.95fr; gap:60px; align-items:center; }
  .eyebrow { display:inline-flex; align-items:center; gap:8px; font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.08em; color:var(--seal-bright); text-transform:uppercase; margin-bottom:22px; }
  .eyebrow::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--seal-bright); }
  .hero h1 { font-size:52px; line-height:1.08; color:var(--paper); margin-bottom:22px; }
  .hero h1 em { font-style:italic; color:var(--seal-bright); }
  .hero p.sub { font-size:17px; color:var(--slate); max-width:460px; margin-bottom:34px; }
  .hero-ctas { display:flex; gap:14px; }

  .seal-stage { position:relative; aspect-ratio:1/1; max-width:420px; margin:0 auto; display:flex; align-items:center; justify-content:center; }
  .seal-ring { position:absolute; inset:0; border-radius:50%; border:1px dashed rgba(200,155,60,0.35); animation:spin 40s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .seal-core { width:62%; aspect-ratio:1/1; border-radius:50%; background:radial-gradient(circle at 32% 28%, #1E2C4A, var(--ink-2) 65%); border:1px solid rgba(200,155,60,0.25); display:flex; align-items:center; justify-content:center; position:relative; }
  .seal-core .lock { width:72px; height:72px; }
  .stage-labels { position:absolute; inset:0; }
  .stage-dot { position:absolute; display:flex; align-items:center; gap:8px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--slate); }
  .stage-dot span.dot { width:8px; height:8px; border-radius:50%; background:var(--seal); flex-shrink:0; }
  .stage-dot.active { color:var(--paper); }
  .stage-dot.active span.dot { background:var(--release); box-shadow:0 0 10px rgba(47,143,111,0.6); }
  .stage-1 { top:4%; left:50%; transform:translateX(-50%); }
  .stage-2 { bottom:14%; left:-2%; }
  .stage-3 { bottom:14%; right:-6%; }

  .strip { border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:22px 0; display:flex; gap:48px; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--slate); letter-spacing:0.03em; flex-wrap:wrap; }

  .section { padding:100px 0; }
  .section-head { max-width:560px; margin-bottom:64px; }
  .section-head h2 { font-size:36px; color:var(--paper); line-height:1.2; }
  .section-head p { color:var(--slate); margin-top:14px; font-size:16px; }

  .flow { display:grid; grid-template-columns:repeat(4,1fr); gap:0; position:relative; }
  .flow::before { content:''; position:absolute; top:34px; left:60px; right:60px; height:1px; background:repeating-linear-gradient(90deg, var(--line) 0 8px, transparent 8px 16px); }
  .flow-step { position:relative; padding-right:24px; }
  .flow-num { width:68px; height:68px; border-radius:50%; background:var(--ink-2); border:1px solid rgba(200,155,60,0.3); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--seal-bright); margin-bottom:22px; position:relative; z-index:1; }
  .flow-step h3 { font-size:18px; color:var(--paper); margin-bottom:10px; font-weight:500; }
  .flow-step p { font-size:14px; color:var(--slate); line-height:1.6; }

  .panels { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  .panel { background:var(--ink-2); border:1px solid var(--line); border-radius:16px; padding:40px; }
  .panel-tag { font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--seal-bright); margin-bottom:18px; display:block; }
  .panel h3 { font-size:24px; color:var(--paper); margin-bottom:14px; }
  .panel p { color:var(--slate); font-size:15px; margin-bottom:26px; }
  .panel ul { list-style:none; margin-bottom:30px; }
  .panel li { font-size:14px; color:var(--paper); padding:10px 0; border-top:1px solid var(--line); display:flex; gap:10px; align-items:flex-start; }
  .panel li:first-child { border-top:none; }
  .panel li::before { content:'—'; color:var(--seal); flex-shrink:0; }

  .ledger-demo { background:var(--paper); color:var(--ink); border-radius:16px; padding:44px; display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:center; }
  .ledger-demo h2 { font-size:30px; color:var(--ink); margin-bottom:16px; }
  .ledger-demo p { color:#565A6B; font-size:15px; margin-bottom:20px; }
  .ledger-card { background:var(--ink); border-radius:12px; padding:28px; font-family:'IBM Plex Mono',monospace; }
  .status-pill { display:inline-flex; align-items:center; gap:6px; background:rgba(47,143,111,0.15); color:var(--release); font-size:11px; padding:5px 10px; border-radius:100px; margin-top:16px; }
  .status-pill .d { width:6px; height:6px; border-radius:50%; background:var(--release); }

  .cta-final { text-align:center; padding:110px 0 80px; }
  .cta-final h2 { font-size:42px; color:var(--paper); margin-bottom:20px; }
  .cta-final p { color:var(--slate); font-size:16px; margin-bottom:36px; }

  footer { border-top:1px solid var(--line); padding:32px 0; display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--slate); }

  /* ===== AUTH ===== */
  .auth-wrap { max-width:420px; margin:60px auto; }
  .auth-tabs { display:flex; gap:4px; background:var(--ink-2); border-radius:10px; padding:4px; margin-bottom:32px; }
  .auth-tab { flex:1; text-align:center; padding:10px; border-radius:7px; background:none; color:var(--slate); font-size:14px; font-weight:500; }
  .auth-tab.active { background:var(--ink-3); color:var(--paper); }
  .field { margin-bottom:18px; }
  .field label { display:block; font-size:12px; color:var(--slate); margin-bottom:7px; font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:0.05em; }
  .field input, .field textarea, .field select { width:100%; background:var(--ink-2); border:1px solid var(--line); border-radius:8px; padding:12px 14px; color:var(--paper); font-size:14px; outline:none; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color:var(--seal); }
  .field textarea { resize:vertical; min-height:90px; }
  .role-pick { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .role-opt { border:1px solid var(--line); border-radius:10px; padding:16px; text-align:left; background:var(--ink-2); }
  .role-opt.selected { border-color:var(--seal); background:var(--ink-3); }
  .role-opt strong { display:block; font-size:14px; color:var(--paper); margin-bottom:4px; }
  .role-opt span { font-size:12px; color:var(--slate); }
  .auth-title { text-align:center; margin-bottom:8px; font-size:26px; }
  .auth-sub { text-align:center; color:var(--slate); font-size:14px; margin-bottom:32px; }
  .error-msg { background:rgba(192,86,75,0.12); border:1px solid rgba(192,86,75,0.3); color:#E08A80; font-size:13px; padding:10px 14px; border-radius:8px; margin-bottom:16px; }
  .back-link { display:inline-block; margin-bottom:24px; font-size:13px; color:var(--slate); }
  .back-link:hover { color:var(--paper); }

  /* ===== DASHBOARD ===== */
  .dash-head { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:32px; flex-wrap:wrap; gap:16px; }
  .dash-head h1 { font-size:28px; }
  .dash-head p { color:var(--slate); font-size:14px; margin-top:6px; }
  .tabs { display:flex; gap:8px; margin-bottom:28px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .tab-btn { padding:10px 4px; margin-right:24px; background:none; color:var(--slate); font-size:14px; border-bottom:2px solid transparent; }
  .tab-btn.active { color:var(--paper); border-bottom-color:var(--seal); }

  .empty { text-align:center; padding:70px 20px; color:var(--slate); border:1px dashed var(--line); border-radius:14px; }
  .empty p { margin-top:8px; font-size:14px; }

  .deal-grid { display:flex; flex-direction:column; gap:14px; }
  .deal-card { background:var(--ink-2); border:1px solid var(--line); border-radius:12px; padding:22px 24px; }
  .deal-top { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:12px; }
  .deal-top h3 { font-size:17px; color:var(--paper); font-weight:500; }
  .deal-meta { font-size:12px; color:var(--slate); margin-top:4px; font-family:'IBM Plex Mono',monospace; }
  .deal-note { font-size:14px; color:var(--slate); margin-bottom:16px; line-height:1.6; }
  .deal-foot { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
  .deal-actions { display:flex; gap:10px; }
  .amount { font-family:'IBM Plex Mono',monospace; font-size:16px; color:var(--seal-bright); font-weight:500; }

  .status { font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; padding:5px 11px; border-radius:100px; display:inline-flex; align-items:center; gap:6px; }
  .status .d { width:6px; height:6px; border-radius:50%; }
  .status-open { background:rgba(200,155,60,0.12); color:var(--seal-bright); } .status-open .d { background:var(--seal-bright); }
  .status-progress { background:rgba(139,147,167,0.15); color:var(--slate); } .status-progress .d { background:var(--slate); }
  .status-waiting { background:rgba(200,155,60,0.12); color:var(--seal-bright); } .status-waiting .d { background:var(--seal-bright); }
  .status-released { background:rgba(47,143,111,0.15); color:var(--release); } .status-released .d { background:var(--release); }
  .status-dispute { background:rgba(192,86,75,0.15); color:var(--danger); } .status-dispute .d { background:var(--danger); }
  .status-cancelled { background:rgba(139,147,167,0.1); color:var(--slate-dim); } .status-cancelled .d { background:var(--slate-dim); }

  .confirm-row { display:flex; gap:18px; font-size:12px; color:var(--slate); margin-top:14px; font-family:'IBM Plex Mono',monospace; }
  .confirm-row .yes { color:var(--release); }

  .overlay { position:fixed; inset:0; background:rgba(15,23,41,0.75); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal { background:var(--ink-2); border:1px solid var(--line); border-radius:16px; padding:36px; max-width:480px; width:100%; max-height:88vh; overflow-y:auto; }
  .modal h2 { font-size:22px; margin-bottom:22px; }
  .modal-foot { display:flex; gap:12px; margin-top:26px; flex-wrap:wrap; }

  .ledger-box { background:var(--ink); border-radius:10px; padding:18px 20px; margin-bottom:20px; font-family:'IBM Plex Mono',monospace; font-size:13px; }
  .ledger-line { display:flex; justify-content:space-between; padding:7px 0; color:var(--slate); }
  .ledger-line b { color:var(--paper); }
  .ledger-line.total { border-top:1px solid var(--line); margin-top:6px; padding-top:12px; }
  .ledger-line.total b { color:var(--seal-bright); }

  .note-box { background:var(--ink); border:1px solid var(--line); border-radius:10px; padding:16px 18px; font-size:13px; color:var(--slate); margin-bottom:18px; line-height:1.6; }
  .note-box .who { font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; color:var(--seal-bright); display:block; margin-bottom:6px; }

  .banner { background:linear-gradient(90deg, rgba(200,155,60,0.08), transparent); border:1px solid rgba(200,155,60,0.25); border-radius:12px; padding:14px 20px; font-size:13px; color:var(--slate); margin-bottom:28px; display:flex; align-items:center; gap:10px; }

  .admin-note { font-size:12px; color:var(--slate-dim); margin-top:24px; text-align:center; }

  @media (max-width: 860px) {
    .hero { grid-template-columns:1fr; padding-top:60px; }
    .hero h1 { font-size:36px; }
    nav .links { display:none; }
    .flow { grid-template-columns:1fr 1fr; row-gap:40px; }
    .flow::before { display:none; }
    .panels, .ledger-demo { grid-template-columns:1fr; }
    .strip { gap:20px; }
  }
  @media (max-width: 640px) {
    .app, .wrap { padding-left:18px; padding-right:18px; }
    .dash-head { flex-direction:column; align-items:flex-start; }
    .role-pick { grid-template-columns:1fr; }
    .deal-foot { flex-direction:column; align-items:flex-start; }
  }
</style>
</head>
<body>

<div id="root"></div>

<script>
/* ============ STORAGE (localStorage-based, single-device demo) ============ */
const DB = {
  read(key, fallback) { try { const v = localStorage.getItem('vilizzia_'+key); return v ? JSON.parse(v) : fallback; } catch(e){ return fallback; } },
  write(key, val) { localStorage.setItem('vilizzia_'+key, JSON.stringify(val)); }
};

let users = DB.read('users', []);
let deals = DB.read('deals', []);
let session = DB.read('session', null);
let view = session ? 'dashboard' : 'landing'; // 'landing' | 'auth' | 'dashboard'
let authMode = 'signup';
let signupRole = 'client';
let authError = '';
let activeTab = 'all';
let modalDeal = null;

const COMMISSION_RATE = 0.08;
function saveAll() { DB.write('users', users); DB.write('deals', deals); DB.write('session', session); }
function esc(s){ const d=document.createElement('div'); d.innerText = s; return d.innerHTML; }
function fmt(n){ return '₹' + Number(n).toLocaleString('en-IN'); }
function timeAgo(ts){ const diff=Date.now()-ts, m=Math.floor(diff/60000), h=Math.floor(m/60), d=Math.floor(h/24); if(d>0) return d+'d ago'; if(h>0) return h+'h ago'; if(m>0) return m+'m ago'; return 'just now'; }
function currentUser(){ return session ? users.find(u=>u.id===session.userId) : null; }
function isFounder(){ const u=currentUser(); return u && u.email==='founder@vilizzia.com'; }

/* ============ LOGO / NAV ============ */
function logoHtml(){
  return `<div class="logo"><div class="logo-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6l-8-4z" stroke="#0F1729" stroke-width="1.6" fill="none"/></svg></div>Vilizzia</div>`;
}

function navHtml(){
  const u = currentUser();
  if (view==='landing' && !u) {
    return `<nav>
      <a href="#" data-action="go-landing">${logoHtml()}</a>
      <div class="links">
        <a href="#how">How it works</a><a href="#clients">For clients</a><a href="#engineers">For engineers</a>
      </div>
      <a href="#" class="nav-cta" data-action="open-auth" data-mode="signup">Sign up</a>
    </nav>`;
  }
  return `<nav>
    <a href="#" data-action="go-landing">${logoHtml()}</a>
    <div class="nav-right">
      ${u ? `
        <div class="nav-user"><span>${esc(u.name)}</span><span class="role-badge">${isFounder()?'founder':u.role}</span></div>
        <button class="btn-link" data-action="logout">Sign out</button>
      ` : `<button class="btn-link" data-action="open-auth" data-mode="login">Log in</button>
           <a href="#" class="nav-cta" data-action="open-auth" data-mode="signup">Sign up</a>`}
    </div>
  </nav>`;
}

/* ============ RENDER ============ */
function render(){
  const root = document.getElementById('root');
  let body;
  if (view==='landing') body = `<div class="wrap">${navHtml()}</div>` + landingHtml();
  else if (view==='auth') body = `<div class="wrap">${navHtml()}</div>` + `<div class="app">${authHtml()}</div>`;
  else body = `<div class="wrap">${navHtml()}</div>` + `<div class="app">${dashboardHtml()}</div>`;
  root.innerHTML = body + (modalDeal ? modalHtml() : '');
  attachEvents();
  window.scrollTo(0,0);
}

/* ============ LANDING ============ */
function landingHtml(){
  return `
  <div class="wrap">
    <section class="hero">
      <div>
        <div class="eyebrow">Escrow for freelance dev work</div>
        <h1>Nobody gets paid until <em>both sides</em> say it's done.</h1>
        <p class="sub">Vilizzia holds the payment while a client and engineer work through a fix. Money only moves when the scope note is agreed on both ends — never before.</p>
        <div class="hero-ctas">
          <a href="#" class="btn btn-primary" data-action="open-auth" data-mode="signup">Start a deal</a>
          <a href="#how" class="btn btn-ghost">See how it works</a>
        </div>
      </div>
      <div class="seal-stage">
        <div class="seal-ring"></div>
        <div class="seal-core"><svg class="lock" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="10" rx="2" stroke="#C89B3C" stroke-width="1.3"/><path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="#C89B3C" stroke-width="1.3"/><circle cx="12" cy="16" r="1.6" fill="#C89B3C"/></svg></div>
        <div class="stage-labels">
          <div class="stage-dot active"><span class="dot"></span>Deposited</div>
          <div class="stage-dot"><span class="dot"></span>In progress</div>
          <div class="stage-dot"><span class="dot"></span>Released</div>
        </div>
      </div>
    </section>
  </div>
  <div class="strip"><span>NO ADVANCE PAYMENT</span><span>NO SILENT DISAPPEARANCE</span><span>REFUND TO SOURCE IF EITHER SIDE WALKS</span></div>
  <div class="wrap">
    <section class="section" id="how">
      <div class="section-head">
        <div class="eyebrow">How it works</div>
        <h2>Four steps. Nothing moves without agreement.</h2>
        <p>Client and engineer connect however they already do — Vilizzia only steps in to hold the money safely in between.</p>
      </div>
      <div class="flow">
        <div class="flow-step"><div class="flow-num">01</div><h3>Describe & deposit</h3><p>Client writes what's broken and deposits the agreed amount into Vilizzia.</p></div>
        <div class="flow-step"><div class="flow-num">02</div><h3>Engineer confirms</h3><p>The engineer reviews the note and agrees to the scope before starting work.</p></div>
        <div class="flow-step"><div class="flow-num">03</div><h3>Work gets done</h3><p>Fix is delivered within the agreed window. Urgent jobs can add extra pay.</p></div>
        <div class="flow-step"><div class="flow-num">04</div><h3>Both confirm, funds release</h3><p>Client and engineer both sign off. Payment releases, minus Vilizzia's commission.</p></div>
      </div>
    </section>
    <section class="section">
      <div class="panels">
        <div class="panel" id="clients">

}

/* ============ AUTH ============ */
function authHtml(){
  return `
  <div class="auth-wrap">
    <a href="#" class="back-link" data-action="go-landing">← Back to home</a>
    <h1 class="auth-title">${authMode==='signup' ? 'Create your account' : 'Welcome back'}</h1>
    <p class="auth-sub">${authMode==='signup' ? 'Takes about a minute.' : 'Sign in to see your deals.'}</p>
    <div class="auth-tabs">
      <button class="auth-tab ${authMode==='signup'?'active':''}" data-action="set-auth-mode" data-mode="signup">Sign up</button>
      <button class="auth-tab ${authMode==='login'?'active':''}" data-action="set-auth-mode" data-mode="login">Log in</button>
    </div>
    ${authError ? `<div class="error-msg">${esc(authError)}</div>` : ''}
    <form id="auth-form">
      ${authMode==='signup' ? `
        <div class="field"><label>Full name</label><input type="text" id="f-name" required /></div>
        <div class="field">
          <label>I am a</label>
          <div class="role-pick">
            <button type="button" class="role-opt ${signupRole==='client'?'selected':''}" data-action="pick-role" data-role="client"><strong>Client</strong><span>I need something fixed</span></button>
            <button type="button" class="role-opt ${signupRole==='engineer'?'selected':''}" data-action="pick-role" data-role="engineer"><strong>Engineer</strong><span>I fix things</span></button>
          </div>
        </div>
      ` : ''}
      <div class="field"><label>Email</label><input type="email" id="f-email" required /></div>
      <div class="field"><label>Password</label><input type="password" id="f-pass" required minlength="4" /></div>
      <button type="submit" class="btn btn-primary btn-full">${authMode==='signup' ? 'Create account' : 'Log in'}</button>
    </form>
    <p class="admin-note">Founder / dispute review login: founder@vilizzia.com · any password</p>
  </div>`;
}

/* ============ DASHBOARD ============ */
function dashboardHtml(){
  const u = currentUser();
  if (!u) { view='landing'; return landingHtml(); }
  if (isFounder()) return founderDashboard();
  return u.role==='client' ? clientDashboard(u) : engineerDashboard(u);
}

function clientDashboard(u){
  const myDeals = deals.filter(d=>d.clientId===u.id);
  const filtered = activeTab==='all' ? myDeals : myDeals.filter(d=>d.status===activeTab);
  return `
    <div class="banner">🛈 &nbsp; Held in escrow until you and the engineer both confirm the work is done.</div>
    <div class="dash-head"><div><h1>Your deals</h1><p>${myDeals.length} total · ${myDeals.filter(d=>d.status==='released').length} completed</p></div>
      <button class="btn btn-primary" data-action="open-new-deal">+ Post a problem</button></div>
    ${dealTabs(myDeals)}
    ${filtered.length ? `<div class="deal-grid">${filtered.map(d=>dealCard(d,u)).join('')}</div>` : emptyState('No deals yet','Post your first problem to get an engineer started.')}
  `;
}

function engineerDashboard(u){
  const openDeals = deals.filter(d=>d.status==='open' && d.clientId!==u.id);
  const myDeals = deals.filter(d=>d.engineerId===u.id);
  const filtered = activeTab==='open' ? openDeals : (activeTab==='all' ? myDeals : myDeals.filter(d=>d.status===activeTab));
  return `
    <div class="banner">🛈 &nbsp; The client's money is already deposited before you agree to any scope.</div>
    <div class="dash-head"><div><h1>Deals</h1><p>${myDeals.length} taken on · ${openDeals.length} open right now</p></div></div>
    <div class="tabs">
      <button class="tab-btn ${activeTab==='open'?'active':''}" data-action="set-tab" data-tab="open">Open (${openDeals.length})</button>
      <button class="tab-btn ${activeTab==='all'?'active':''}" data-action="set-tab" data-tab="all">My deals (${myDeals.length})</button>
    </div>
    ${filtered.length ? `<div class="deal-grid">${filtered.map(d=>dealCard(d,u)).join('')}</div>` : emptyState(activeTab==='open'?'No open deals right now':'No deals yet', activeTab==='open'?'Check back soon — new problems get posted regularly.':'Accept an open deal to get started.')}
  `;
}

function founderDashboard(){
  const disputed = deals.filter(d=>d.status==='dispute');
  const active = deals.filter(d=>['open','progress','waiting'].includes(d.status));
  const released = deals.filter(d=>d.status==='released');
  const list = activeTab==='all'?deals:deals.filter(d=>activeTab==='progress'?['open','progress','waiting'].includes(d.status):d.status===activeTab);
  return `
    <div class="banner">🛈 &nbsp; Founder view — resolve disputes and monitor all deals on the platform.</div>
    <div class="dash-head"><div><h1>Platform overview</h1><p>${deals.length} total deals · ${disputed.length} need review</p></div></div>
    <div class="tabs">
      <button class="tab-btn ${activeTab==='all'?'active':''}" data-action="set-tab" data-tab="all">All (${deals.length})</button>
      <button class="tab-btn ${activeTab==='dispute'?'active':''}" data-action="set-tab" data-tab="dispute">Disputes (${disputed.length})</button>
      <button class="tab-btn ${activeTab==='progress'?'active':''}" data-action="set-tab" data-tab="progress">Active (${active.length})</button>
      <button class="tab-btn ${activeTab==='released'?'active':''}" data-action="set-tab" data-tab="released">Released (${released.length})</button>
    </div>
    ${list.length ? `<div class="deal-grid">${list.map(d=>dealCard(d,null,true)).join('')}</div>` : emptyState('Nothing here','This view is empty right now.')}
  `;
}

function dealTabs(list){
  const c = { all:list.length, open:list.filter(d=>d.status==='open').length, progress:list.filter(d=>d.status==='progress'||d.status==='waiting').length, released:list.filter(d=>d.status==='released').length, dispute:list.filter(d=>d.status==='dispute').length };
  return `<div class="tabs">
    <button class="tab-btn ${activeTab==='all'?'active':''}" data-action="set-tab" data-tab="all">All (${c.all})</button>
    <button class="tab-btn ${activeTab==='open'?'active':''}" data-action="set-tab" data-tab="open">Awaiting engineer (${c.open})</button>
    <button class="tab-btn ${activeTab==='progress'?'active':''}" data-action="set-tab" data-tab="progress">In progress (${c.progress})</button>
    <button class="tab-btn ${activeTab==='released'?'active':''}" data-action="set-tab" data-tab="released">Completed (${c.released})</button>
    ${c.dispute ? `<button class="tab-btn ${activeTab==='dispute'?'active':''}" data-action="set-tab" data-tab="dispute">Disputed (${c.dispute})</button>` : ''}
  </div>`;
}

function emptyState(title, sub){ return `<div class="empty"><h3>${esc(title)}</h3><p>${esc(sub)}</p></div>`; }

const STATUS_LABEL = { open:'Awaiting engineer', progress:'In progress', waiting:'Awaiting both confirmations', released:'Released', dispute:'Disputed', cancelled:'Cancelled — refunded' };
const STATUS_CLASS = { open:'status-open', progress:'status-progress', waiting:'status-waiting', released:'status-released', dispute:'status-dispute', cancelled:'status-cancelled' };

function dealCard(d, u, founderView){
  const client = users.find(x=>x.id===d.clientId);
  const engineer = d.engineerId ? users.find(x=>x.id===d.engineerId) : null;
  return `
  <div class="deal-card">
    <div class="deal-top">
      <div><h3>${esc(d.title)}</h3><div class="deal-meta">${founderView?`${esc(client?.name||'—')} → ${engineer?esc(engineer.name):'unassigned'} · `:''}Posted ${timeAgo(d.createdAt)}</div></div>
      <span class="status ${STATUS_CLASS[d.status]}"><span class="d"></span>${STATUS_LABEL[d.status]}</span>
    </div>
    <p class="deal-note">${esc(d.note)}</p>
    <div class="deal-foot"><span class="amount">${fmt(d.amount)}</span>
      <div class="deal-actions"><button class="btn btn-ghost btn-sm" data-action="view-deal" data-id="${d.id}">View details</button></div>
    </div>
    ${d.status==='progress'||d.status==='waiting' ? `<div class="confirm-row"><span class="${d.clientConfirmed?'yes':''}">${d.clientConfirmed?'✓':'○'} Client confirmed</span><span class="${d.engineerConfirmed?'yes':''}">${d.engineerConfirmed?'✓':'○'} Engineer confirmed</span></div>` : ''}
  </div>`;
}

/* ============ MODAL ============ */
function modalHtml(){ return modalDeal.mode==='new' ? newDealModal() : viewDealModal(modalDeal.deal); }

function newDealModal(){
  return `
  <div class="overlay" data-action="close-modal-bg">
    <div class="modal" onclick="event.stopPropagation()">
      <h2>Post a problem</h2>
      <form id="new-deal-form">
        <div class="field"><label>Title</label><input type="text" id="d-title" placeholder="e.g. Login endpoint returning 500" required /></div>
        <div class="field"><label>Describe the error / scope</label><textarea id="d-note" placeholder="Be specific — this note is what the engineer agrees to and what disputes get resolved against." required></textarea></div>
        <div class="field"><label>Amount to deposit (₹)</label><input type="number" id="d-amount" min="100" placeholder="e.g. 5000" required /></div>
        <div class="field"><label>Time window</label>
          <select id="d-window"><option value="24 hrs">24 hours (urgent)</option><option value="48 hrs" selected>48 hours</option><option value="1 week">1 week</option><option value="2 weeks">2 weeks</option></select>
        </div>
        <div class="ledger-box" id="fee-preview">
          <div class="ledger-line"><span>Your deposit</span><b>₹0</b></div>
          <div class="ledger-line"><span>Vilizzia commission (8%)</span><b>₹0</b></div>
          <div class="ledger-line total"><span>Engineer receives on release</span><b>₹0</b></div>
        </div>
        <div class="modal-foot">
          <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Deposit & post</button>
        </div>
      </form>
    </div>
  </div>`;
}

function viewDealModal(d){
  const u = currentUser();
  const client = users.find(x=>x.id===d.clientId);
  const engineer = d.engineerId ? users.find(x=>x.id===d.engineerId) : null;
  const founder = isFounder();
  const isClient = u && u.id===d.clientId;
  const isEngineer = u && u.id===d.engineerId;
  const commission = Math.round(d.amount*COMMISSION_RATE);
  const payout = d.amount - commission;

  let actions = '';
  if (d.status==='open' && !isClient && u && u.role==='engineer' && !founder) actions = `<button class="btn btn-primary btn-full" data-action="accept-deal" data-id="${d.id}">Confirm scope & take this on</button>`;
  else if (d.status==='progress' || d.status==='waiting') {
    if (isClient && !d.clientConfirmed) actions += `<button class="btn btn-primary" data-action="confirm-complete" data-id="${d.id}" data-who="client">Mark as complete</button>`;
    if (isEngineer && !d.engineerConfirmed) actions += `<button class="btn btn-primary" data-action="confirm-complete" data-id="${d.id}" data-who="engineer">Mark as complete</button>`;
    if (isClient || isEngineer) actions += `<button class="btn btn-danger" data-action="raise-dispute" data-id="${d.id}">Raise a dispute</button>`;
  } else if (d.status==='dispute' && founder) {
    actions = `<button class="btn btn-release" data-action="resolve-dispute" data-id="${d.id}" data-outcome="engineer">Release to engineer</button>
               <button class="btn btn-danger" data-action="resolve-dispute" data-id="${d.id}" data-outcome="client">Refund client</button>`;
  }
  if (d.status==='open' && isClient) actions += `<button class="btn btn-danger" data-action="cancel-deal" data-id="${d.id}">Cancel & refund</button>`;

  return `
  <div class="overlay" data-action="close-modal-bg">
    <div class="modal" onclick="event.stopPropagation()">
      <h2>${esc(d.title)}</h2>
      <span class="status ${STATUS_CLASS[d.status]}" style="margin-bottom:20px; display:inline-flex;"><span class="d"></span>${STATUS_LABEL[d.status]}</span>
      <div class="note-box"><span class="who">Scope note — by ${esc(client?.name||'client')}</span>${esc(d.note)}</div>
      <div class="ledger-box">
        <div class="ledger-line"><span>Client</span><b>${esc(client?.name||'—')}</b></div>
        <div class="ledger-line"><span>Engineer</span><b>${engineer?esc(engineer.name):'Not yet assigned'}</b></div>
        <div class="ledger-line"><span>Window</span><b>${esc(d.window)}</b></div>
        <div class="ledger-line"><span>Deposit</span><b>${fmt(d.amount)}</b></div>
        <div class="ledger-line"><span>Commission (8%)</span><b>${fmt(commission)}</b></div>
        <div class="ledger-line total"><span>Engineer receives</span><b>${fmt(payout)}</b></div>
      </div>
      ${d.status==='dispute' ? `<div class="note-box"><span class="who" style="color:var(--danger)">Dispute raised</span>Reviewing against the original scope note above. ${founder?'Decide the outcome below.':'Vilizzia will review and resolve this shortly.'}</div>` : ''}
      ${d.status==='released' ? `<div class="note-box"><span class="who" style="color:var(--release)">Released</span>Funds transferred to the engineer. Deal closed.</div>` : ''}
      ${d.status==='cancelled' ? `<div class="note-box"><span class="who">Cancelled</span>Deposit refunded to the client's source account.</div>` : ''}
      <div class="modal-foot">${actions}<button class="btn btn-ghost" data-action="close-modal">Close</button></div>
    </div>
  </div>`;
}

/* ============ EVENTS ============ */
function attachEvents(){
  document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click', handleAction));
  const authForm = document.getElementById('auth-form');
  if (authForm) authForm.addEventListener('submit', handleAuthSubmit);
  const newDealForm = document.getElementById('new-deal-form');
  if (newDealForm){ newDealForm.addEventListener('submit', handleNewDeal); document.getElementById('d-amount').addEventListener('input', updateFeePreview); }
}

function updateFeePreview(){
  const amt = Number(document.getElementById('d-amount').value)||0;
  const commission = Math.round(amt*COMMISSION_RATE);
  document.getElementById('fee-preview').innerHTML = `
    <div class="ledger-line"><span>Your deposit</span><b>${fmt(amt)}</b></div>
    <div class="ledger-line"><span>Vilizzia commission (8%)</span><b>${fmt(commission)}</b></div>
    <div class="ledger-line total"><span>Engineer receives on release</span><b>${fmt(amt-commission)}</b></div>`;
}

function handleAction(e){
  e.preventDefault();
  const action = e.currentTarget.dataset.action;
  const id = e.currentTarget.dataset.id;

  if (action==='go-landing') { view = session ? 'dashboard' : 'landing'; modalDeal=null; render(); }
  else if (action==='open-auth') {
    authMode = e.currentTarget.dataset.mode || 'signup';
    if (e.currentTarget.dataset.role) signupRole = e.currentTarget.dataset.role;
    authError=''; view='auth'; render();
  }
  else if (action==='set-auth-mode') { authMode = e.currentTarget.dataset.mode; authError=''; render(); }
  else if (action==='pick-role') { signupRole = e.currentTarget.dataset.role; render(); }
  else if (action==='logout') { session=null; saveAll(); view='landing'; render(); }
  else if (action==='open-new-deal') { modalDeal={mode:'new'}; render(); }
  else if (action==='close-modal') { modalDeal=null; render(); }
  else if (action==='close-modal-bg') { if(e.target===e.currentTarget){ modalDeal=null; render(); } }
  else if (action==='set-tab') { activeTab = e.currentTarget.dataset.tab; render(); }
  else if (action==='view-deal') { modalDeal={mode:'view', deal:deals.find(x=>x.id===id)}; render(); }
  else if (action==='accept-deal') { acceptDeal(id); }
  else if (action==='confirm-complete') { confirmComplete(id, e.currentTarget.dataset.who); }
  else if (action==='raise-dispute') { raiseDispute(id); }
  else if (action==='resolve-dispute') { resolveDispute(id, e.currentTarget.dataset.outcome); }
  else if (action==='cancel-deal') { cancelDeal(id); }
}

function handleAuthSubmit(e){
  e.preventDefault();
  const email = document.getElementById('f-email').value.trim().toLowerCase();
  const pass = document.getElementById('f-pass').value;

  if (authMode==='signup') {
    const name = document.getElementById('f-name').value.trim();
    if (users.find(u=>u.email===email)) { authError='An account with this email already exists.'; render(); return; }
    const user = { id:'u'+Date.now(), name, email, pass, role:signupRole };
    users.push(user); session={userId:user.id}; saveAll();
    authError=''; activeTab='all'; view='dashboard'; render();
  } else {
    if (email==='founder@vilizzia.com') {
      let f = users.find(u=>u.email===email);
      if (!f) { f={id:'founder', name:'Founder', email, pass, role:'founder'}; users.push(f); }
      session={userId:f.id}; saveAll(); view='dashboard'; render(); return;
    }
    const user = users.find(u=>u.email===email && u.pass===pass);
    if (!user) { authError='No account found with that email and password.'; render(); return; }
    session={userId:user.id}; saveAll(); authError=''; activeTab='all'; view='dashboard'; render();
  }
}

function handleNewDeal(e){
  e.preventDefault();
  const u = currentUser();
  const deal = { id:'d'+Date.now(), clientId:u.id, engineerId:null, title:document.getElementById('d-title').value.trim(), note:document.getElementById('d-note').value.trim(), amount:Number(document.getElementById('d-amount').value), window:document.getElementById('d-window').value, status:'open', clientConfirmed:false, engineerConfirmed:false, createdAt:Date.now() };
  deals.unshift(deal); saveAll(); modalDeal=null; render();
}

function acceptDeal(id){ const d=deals.find(x=>x.id===id); d.engineerId=currentUser().id; d.status='progress'; saveAll(); modalDeal={mode:'view',deal:d}; render(); }
function confirmComplete(id, who){ const d=deals.find(x=>x.id===id); if(who==='client') d.clientConfirmed=true; if(who==='engineer') d.engineerConfirmed=true; d.status = (d.clientConfirmed && d.engineerConfirmed) ? 'released' : 'waiting'; saveAll(); modalDeal={mode:'view',deal:d}; render(); }
function raiseDispute(id){ const d=deals.find(x=>x.id===id); d.status='dispute'; saveAll(); modalDeal={mode:'view',deal:d}; render(); }
function resolveDispute(id, outcome){ const d=deals.find(x=>x.id===id); d.status = outcome==='engineer' ? 'released' : 'cancelled'; saveAll(); modalDeal={mode:'view',deal:d}; render(); }
function cancelDeal(id){ const d=deals.find(x=>x.id===id); d.status='cancelled'; saveAll(); modalDeal=null; render(); }

render();
</script>
